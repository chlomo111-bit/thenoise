<!doctype html><html><head><meta charset=utf-8><style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style></head><body>
<script src="three.min.js"></script>
<script>
// The Noise 22.11 « המקהלה הכי מזייפת בעולם? » חלק 1 : arène géante, gradins de chanteurs FANTÔMES (places vides),
// micro au centre ; démo du barème : 1 chanteur, 3, puis une rangée de 10.
const W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(W,H);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x2a1a5e);scene.fog=new THREE.Fog(0x2a1a5e,60,190);
const camera=new THREE.PerspectiveCamera(55,W/H,.1,500);
scene.add(new THREE.HemisphereLight(0xbfd4ff,0x3a2050,1.0));
const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(10,30,20);scene.add(dl);
// sol de scène + plateau rond lumineux
const floor=new THREE.Mesh(new THREE.CircleGeometry(220,64),new THREE.MeshLambertMaterial({color:0x1d1240}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const stage=new THREE.Mesh(new THREE.CylinderGeometry(14,14.5,1.2,64),new THREE.MeshLambertMaterial({color:0xffffff,emissive:0x553388}));stage.position.y=.6;scene.add(stage);
const ring=new THREE.Mesh(new THREE.TorusGeometry(14.3,.25,8,96),new THREE.MeshBasicMaterial({color:0xFFC24B}));ring.rotation.x=Math.PI/2;ring.position.y=1.25;scene.add(ring);
// gradins en arc (amphithéâtre) derrière la scène
const TIERS=26,PER=70;const tierMat=new THREE.MeshLambertMaterial({color:0x4b3a8c,emissive:0x1a1040});
for(let r=0;r<TIERS;r++){const rad=20+r*3.2,h=1.2+r*1.5;const g=new THREE.CylinderGeometry(rad+1.6,rad+1.6,h,96,1,true,Math.PI*0.5,Math.PI*1.0);
 const m=new THREE.Mesh(g,tierMat);m.position.y=h/2;m.material.side=THREE.DoubleSide;scene.add(m);
 const top=new THREE.Mesh(new THREE.RingGeometry(rad,rad+3.2,96,1,Math.PI*0.5,Math.PI*1.0),new THREE.MeshLambertMaterial({color:r%2?0x6a55b8:0x5a47a6,side:THREE.DoubleSide}));top.rotation.x=-Math.PI/2;top.position.y=h;scene.add(top);}
// chanteurs fantômes (places vides) : InstancedMesh corps + tête
const ghostMat=new THREE.MeshBasicMaterial({color:0xcfd8ff,transparent:true,opacity:.34,depthWrite:false});
const gB=new THREE.InstancedMesh(new THREE.BoxGeometry(.9,1.4,.6),ghostMat,TIERS*PER),gH=new THREE.InstancedMesh(new THREE.BoxGeometry(.75,.75,.75),ghostMat,TIERS*PER);
const GH=[];const dm=new THREE.Object3D();let n=0;
for(let r=0;r<TIERS;r++){const rad=21.6+r*3.2,h=1.2+r*1.5;const cnt=Math.round(PER*(rad/40));
 for(let j=0;j<cnt&&n<TIERS*PER;j++){const a=Math.PI*0.5+Math.PI*(j+.5)/cnt;const x=Math.sin(a)*rad,z=Math.cos(a)*rad;GH.push([x,h,z,a]);
  dm.position.set(x,h+.7,z);dm.rotation.y=a+Math.PI;dm.updateMatrix();gB.setMatrixAt(n,dm.matrix);dm.position.y=h+1.8;dm.updateMatrix();gH.setMatrixAt(n,dm.matrix);n++;}}
gB.count=gH.count=n;scene.add(gB,gH);
// projecteurs (faisceaux additifs)
const beams=[];const bm=new THREE.MeshBasicMaterial({color:0xfff2c0,transparent:true,opacity:.10,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
for(let i=0;i<8;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(4,70,24,1,true),bm.clone());c.geometry.translate(0,-35,0);const a=Math.PI*.55+i*Math.PI*.9/7;c.position.set(Math.sin(a)*70,70,Math.cos(a)*70);scene.add(c);beams.push(c);}
const colors=[0xFF6B6B,0x4ECDC4,0xFFC24B,0xC792EA,0x8FD3FF,0xFF8FB8,0x7BE495,0xFFA45B,0x6C8CFF,0xF7F7F7];
// micro central
const mic=new THREE.Group();const st=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,3.2),new THREE.MeshLambertMaterial({color:0x222222}));st.position.y=2.8;mic.add(st);
const mh=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),new THREE.MeshLambertMaterial({color:0x999999,emissive:0x333333}));mh.position.y=4.5;mic.add(mh);scene.add(mic);
// onde de fausse note
const wave=new THREE.Mesh(new THREE.TorusGeometry(1,.12,8,64),new THREE.MeshBasicMaterial({color:0xff4d6d,transparent:true}));wave.position.set(0,4.5,0);scene.add(wave);
// vrais chanteurs (voxel)
function singer(col){const g=new THREE.Group();const M=c=>new THREE.MeshLambertMaterial({color:c});
 const b=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.5,.8),M(col));b.position.y=1.6;g.add(b);
 const h=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),M(0xffd9b3));h.position.y=2.9;g.add(h);
 const mo=new THREE.Mesh(new THREE.BoxGeometry(.4,.35,.05),M(0x3a0d0d));mo.position.set(0,2.7,.51);g.add(mo);
 for(const s of [-1,1]){const e=new THREE.Mesh(new THREE.BoxGeometry(.14,.14,.05),M(0x111111));e.position.set(.22*s,3.05,.51);g.add(e);
  const a=new THREE.Mesh(new THREE.BoxGeometry(.3,1.1,.3),M(col));a.geometry.translate(0,-.45,0);a.position.set(.72*s,2.25,0);a.rotation.z=s*2.4;g.add(a);g['a'+s]=a;
  const l=new THREE.Mesh(new THREE.BoxGeometry(.38,.9,.38),M(0x2b2b44));l.position.set(.27*s,.45,0);g.add(l);}
 g.mo=mo;g.head=h;g.visible=false;scene.add(g);return g}
const S=[];for(let i=0;i<14;i++)S.push(singer(colors[i%10]));
// notes de musique (sprites)
function noteSprite(ch,col){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.font='bold 100px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle=col;x.fillText(ch,64,70);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.setScalar(1.2);s.visible=false;scene.add(s);return s}
const NOTES=[];for(let i=0;i<24;i++)NOTES.push(noteSprite(i%3?'♪':'♫',i%2?'#FFC24B':'#ff4d6d'));
const E=k=>{k=Math.max(0,Math.min(1,k));return k*k*(3-2*k)};
const slot=j=>{ // 1 : centre ; 3 : autour ; 10 : rangée devant
 if(j==0)return[0,1.2,3.2]; if(j<4)return[(j-2)*2.4,1.2,0.6]; return[(j-8.5)*2.2,1.2,7.5]};
window.pose=function(shot,t){
 const tt=t;beams.forEach((c,i)=>{c.lookAt(Math.sin(tt*.6+i)*12,0,Math.cos(tt*.5+i)*8);c.rotateX(-Math.PI/2)});
 // onde de fausse note : déclenchée à fn
 const fn=shot.fn,wt=t-fn;wave.visible=wt>=0&&wt<1.2;if(wave.visible){const s=1+wt*16;wave.scale.set(s,s,s);wave.material.opacity=1-wt/1.2;}
 const shake=(wt>=0&&wt<.6)?Math.exp(-wt*5)*.5:0;
 // fantômes qui tremblent (bouchent leurs oreilles) pendant la fausse note
 ghostMat.opacity=.34+(shake>0?.2:0);
 // chanteurs
 let nv=0;S.forEach((g,j)=>{const base=j==0?shot.T1:(j<4?shot.T3:shot.T10);let t0=base==null?null:(j==0?base:(j<4?base+(j-1)*.12:base+(j-4)*.05));if(t0===null||t<t0){g.visible=false;return}
  const k=E((t-t0)/.5),p=slot(j);g.visible=true;nv++;g.position.set(p[0],p[1]+(1-k)*14,p[2]);g.rotation.y=Math.sin(t*2+j)*.15;
  g.a1.rotation.z=2.4+Math.sin(t*7+j)*.3;g['a-1'].rotation.z=-2.4-Math.sin(t*6+j)*.3;g.mo.scale.y=1+Math.abs(Math.sin(t*9+j))*1.2;g.head.rotation.z=Math.sin(t*5+j)*.12});
 NOTES.forEach((s,i)=>{s.visible=nv>0&&i<nv*2;if(!s.visible)return;const j=i%Math.max(1,nv);const p=slot(j);const ph=(t*1.2+i*.37)%2;s.position.set(p[0]+Math.sin(i*2.1+t)*1.2,p[1]+3.4+ph*1.6,p[2]);s.material.opacity=1-ph/2});
 // caméra
 let c,l;
 if(shot.name=='wide'){const k=E(t/6);const a=-.35+t*.06;const r=48-18*k,y=26-14*k;c=[Math.sin(a)*r,y,Math.cos(a)*r];l=[0,9-4*k,-18+10*k];}
 else if(shot.name=='demo'){const k=E(t/7);c=[Math.sin(t*.08)*3,7.5-1.5*k,22-5*k];l=[0,3.4,1.5];}
 else {const k=E(t/9);const a=.25-t*.05;const r=28+62*k,y=10+46*k;c=[Math.sin(a)*r,y,Math.cos(a)*r];l=[0,6+2*k,-10*k-4];}
 camera.position.set(c[0]+Math.sin(t*41)*shake,c[1]+Math.cos(t*37)*shake,c[2]);camera.lookAt(...l);
 renderer.render(scene,camera)};
</script></body></html>
